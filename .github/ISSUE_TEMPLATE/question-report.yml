name: Question report
description: Tell us a question is right, wrong, or misleading — with the guide section it should match.
title: "[Question] "
labels: ["question-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking the questions! Reports are counted nightly and
        shown in the app as a small community signal next to the question.
  - type: dropdown
    id: stance
    attributes:
      label: Verdict
      options:
        - "👍 Good question — accurate and useful"
        - "👎 Bad question — confusing, outdated, or wrong answer"
    validations:
      required: true
  - type: input
    id: question-id
    attributes:
      label: Question id
      description: Shown next to the "Flag this question" button in the practice view (e.g. ch1-023).
    validations:
      required: true
  - type: input
    id: guide-section
    attributes:
      label: Guide section (optional)
      description: Section name or link in drivers-guide-2026.md.
  - type: textarea
    id: comment
    attributes:
      label: What should change, if anything?
