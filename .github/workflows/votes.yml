name: votes
# Nightly aggregation of community question reports (issue 👍/👎 reactions)
# into votes.json, committed back to the repo so the static site can read it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate question reports
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-votes.mjs

      - name: Commit votes.json if changed
        run: |
          git config user.name "vote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add votes.json votes-summary.md 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Votes: refresh community question signals"
          git push
